<!DOCTYPE html>
<html lang="zh-TW">

<head>

<body>
    <div id="main-content">
        <header class="hero">
            <h1>SCITL TOOL BOX</h1>
            <p>純前端、安全的常用工具網站</p>
        </header>

        <main class="tools-section">
            <div class="tools-grid">
                <div class="tool-card">
                    <h3>單位換算</h3>
                    <p>在各種單位之間輕鬆轉換，包含長度、重量、面積、容量、溫度和壓力等常用單位。</p>
                    <a href="unitconv.html" class="card-link">前往工具</a>
                </div>
                <div class="tool-card">
                    <h3>日期時間換算</h3>
                    <p>農曆、日期天數和UNIX / ISO 8601時間戳轉換。</p>
                    <a href="dateconv.html" class="card-link">前往工具</a>
                </div>
                <div class="tool-card">
                    <h3>世界時間</h3>
                    <p>查看全球主要城市時區的實時時間，並使用時區轉換器對照跨國會議時間。</p>
                    <a href="worldtime.html" class="card-link">前往工具</a>
                </div>
                <div class="tool-card">
                    <h3>貨幣匯率換算</h3>
                    <p>查詢全球主要貨幣匯率，並進行金額換算。</p>
                    <a href="currency.html" class="card-link">前往工具</a>
                </div>
                <div class="tool-card">
                    <h3>網路連線測試</h3>
                    <p>測試網站連線速度、查詢 DNS 記錄，並檢測您目前的公網 IP 與網路狀態。</p>
                    <a href="nettest.html" class="card-link">前往工具</a>
                </div>
                <div class="tool-card">
                    <h3>密碼產生器</h3>
                    <p>生成高強度的隨機密碼，保護您的帳戶安全。</p>
                    <a href="passwordgen.html" class="card-link">前往工具</a>
                </div>
            </div>
        </main>
    </div>

    <script src="main.js?v=3"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>密碼／隨機產生器 - SCITL TOOL BOX</title>
    <link rel="stylesheet" href="style.css?v=7">
        <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-9HCQRB0034"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-9HCQRB0034');
    </script>
</head>

<body>
    <div id="main-content">

        <div class="container" style="margin-top: 0;">
            <h2>
                <center>密碼／隨機產生器</center>
            </h2>

            <div class="tabs-container">
                <button class="tab-btn active" data-tab="password-tab">密碼</button>
                <button class="tab-btn" data-tab="string-tab">隨機字串</button>
                <button class="tab-btn" data-tab="uuid-tab">UUID</button>
            </div>

            <div id="password-tab" class="tab-content active">
            <div class="calculator-section">
                <div class="password-display-container">
                    <input type="text" id="passwordDisplay" class="form-input" readonly placeholder="點擊「產生密碼」來生成">
                    <button id="copyBtn" title="複製密碼">複製</button>
                </div>

                <div class="form-group">
                    <label for="passwordLength">密碼長度: <span id="passwordLengthValue">16</span></label>
                    <input type="range" id="passwordLength" min="4" max="64" value="16">
                </div>

                <div class="form-group-checkbox">
                    <input type="checkbox" id="includeUppercase" checked>
                    <label for="includeUppercase">包含大寫字母 (A-Z)</label>
                </div>

                <div class="form-group-checkbox">
                    <input type="checkbox" id="includeLowercase" checked>
                    <label for="includeLowercase">包含小寫字母 (a-z)</label>
                </div>

                <div class="form-group-checkbox">
                    <input type="checkbox" id="includeNumbers" checked>
                    <label for="includeNumbers">包含數字 (0-9)</label>
                </div>

                <div class="form-group-checkbox">
                    <input type="checkbox" id="includeSymbols">
                    <label for="includeSymbols">包含符號 (!@#$%^&*)</label>
                </div>

                <button id="generateBtn">產生密碼</button>
            </div>
            </div>

            <div id="string-tab" class="tab-content">
                <div class="inline-options">
                    <div class="form-group">
                        <label for="stringLength">長度（1–1024）</label>
                        <input type="number" id="stringLength" class="form-input" value="32" min="1" max="1024">
                    </div>
                    <div class="form-group">
                        <label for="stringCount">數量（1–1000）</label>
                        <input type="number" id="stringCount" class="form-input" value="5" min="1" max="1000">
                    </div>
                    <div class="form-group">
                        <label for="stringCharset">字元集</label>
                        <select id="stringCharset" class="form-input">
                            <option value="alnum">英數字（A-Z、a-z、0-9）</option>
                            <option value="lower">小寫英數（a-z、0-9）</option>
                            <option value="upper">大寫英數（A-Z、0-9）</option>
                            <option value="digits">純數字（0-9）</option>
                            <option value="hex">十六進位（0-9、a-f）</option>
                            <option value="base64url">Base64URL（英數字、- 和 _）</option>
                            <option value="custom">自訂</option>
                        </select>
                    </div>
                </div>
                <div class="form-group" id="customCharsGroup" hidden>
                    <label for="customChars">自訂字元（重複的字元會自動移除）</label>
                    <input type="text" id="customChars" class="form-input" value="ABCDEF0123456789" spellcheck="false">
                </div>
                <div class="action-row">
                    <div class="form-group-checkbox">
                        <input type="checkbox" id="excludeSimilar">
                        <label for="excludeSimilar">排除易混淆字元（0 O o 1 l I）</label>
                    </div>
                </div>
                <p id="stringInfo" class="hint-text"></p>
            </div>

            <div id="uuid-tab" class="tab-content">
                <div class="inline-options">
                    <div class="form-group">
                        <label for="uuidVersion">版本</label>
                        <select id="uuidVersion" class="form-input">
                            <option value="4">v4（完全隨機）</option>
                            <option value="7">v7（依時間排序）</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="uuidCount">數量（1–1000）</label>
                        <input type="number" id="uuidCount" class="form-input" value="5" min="1" max="1000">
                    </div>
                </div>
                <div class="action-row">
                    <div class="form-group-checkbox">
                        <input type="checkbox" id="uuidUpper">
                        <label for="uuidUpper">大寫</label>
                    </div>
                    <div class="form-group-checkbox">
                        <input type="checkbox" id="uuidNoHyphen">
                        <label for="uuidNoHyphen">移除連字號</label>
                    </div>
                    <div class="form-group-checkbox">
                        <input type="checkbox" id="uuidBraces">
                        <label for="uuidBraces">加上大括號 { }</label>
                    </div>
                </div>
                <p class="hint-text">v7 開頭為毫秒時間戳記，依產生時間排序，適合作為資料庫主鍵；v4 則完全隨機。</p>
            </div>

            <!-- 隨機字串與 UUID 頁籤共用的批次輸出區，密碼頁籤時隱藏 -->
            <div id="batchOutput" hidden>
                <div class="action-row">
                    <button id="batchGenerateBtn">重新產生</button>
                    <button id="batchCopyBtn" class="reset-btn">全部複製</button>
                </div>
                <div class="form-group">
                    <label for="batchResult">結果（每行一個）</label>
                    <textarea id="batchResult" class="form-input code-textarea" readonly spellcheck="false" rows="10"></textarea>
                </div>
                <p id="batchError" class="error-text" role="alert"></p>
            </div>
        </div>
    </div>

    <script src="main.js?v=6"></script>
    <script>
        // --- 密碼產生器邏輯 ---
        const passwordDisplay = document.getElementById('passwordDisplay');
        const passwordLength = document.getElementById('passwordLength');
        const passwordLengthValue = document.getElementById('passwordLengthValue');
        const includeUppercase = document.getElementById('includeUppercase');
        const includeLowercase = document.getElementById('includeLowercase');
        const includeNumbers = document.getElementById('includeNumbers');
        const includeSymbols = document.getElementById('includeSymbols');
        const generateBtn = document.getElementById('generateBtn');
        const copyBtn = document.getElementById('copyBtn');

        const uppercaseChars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        const lowercaseChars = 'abcdefghijklmnopqrstuvwxyz';
        const numberChars = '0123456789';
        const symbolChars = '!@#$%^&*()_+-=[]{}|;:,.<>?';

        // 同步滑桿與數字顯示
        passwordLength.addEventListener('input', (e) => {
            passwordLengthValue.textContent = e.target.value;
        });

        // 產生密碼事件
        generateBtn.addEventListener('click', () => {
            const pools = [
                [includeUppercase, uppercaseChars],
                [includeLowercase, lowercaseChars],
                [includeNumbers, numberChars],
                [includeSymbols, symbolChars],
            ].filter(([checkbox]) => checkbox.checked).map(([, chars]) => chars);

            if (pools.length === 0) {
                alert('請至少選擇一種字元類型！');
                return;
            }

            const charPool = pools.join('');
            const length = Math.max(parseInt(passwordLength.value, 10), pools.length);

            // 每個勾選的字元類型至少出現一次，其餘從全部字元池補滿，最後洗牌
            const chars = pools.map(pool => pool[randomInt(pool.length)]);
            while (chars.length < length) {
                chars.push(charPool[randomInt(charPool.length)]);
            }
            for (let i = chars.length - 1; i > 0; i--) {
                const j = randomInt(i + 1);
                [chars[i], chars[j]] = [chars[j], chars[i]];
            }
            const password = chars.join('');

            passwordDisplay.value = password;
        });

        // 複製密碼事件
        copyBtn.addEventListener('click', () => {
            const password = passwordDisplay.value;
            if (!password) {
                alert('沒有可複製的密碼！');
                return;
            }

            navigator.clipboard.writeText(password).then(() => {
                const originalText = copyBtn.textContent;
                copyBtn.textContent = '已複製!';
                setTimeout(() => {
                    copyBtn.textContent = originalText;
                }, 1500);
            }).catch(err => {
                console.error('無法複製密碼: ', err);
                alert('複製失敗，請手動複製。');
            });
        });

        // 頁面載入時自動產生一個預設密碼
        document.addEventListener('DOMContentLoaded', () => {
            generateBtn.click();
        });

        // --- UUID ---
        const MAX_COUNT = 1000;
        const MAX_LENGTH = 1024;

        const toHex = (bytes) => Array.from(bytes, b => b.toString(16).padStart(2, '0')).join('');

        // 設定版本號（第 7 位元組高 4 位元）與 RFC 9562 變體（第 9 位元組高 2 位元為 10）
        function setVersion(bytes, version) {
            bytes[6] = (bytes[6] & 0x0f) | (version << 4);
            bytes[8] = (bytes[8] & 0x3f) | 0x80;
            return bytes;
        }

        function uuidV4() {
            return setVersion(crypto.getRandomValues(new Uint8Array(16)), 4);
        }

        // v7：前 48 位元為 Unix 毫秒時間戳記，接著 12 位元的 rand_a 在同一毫秒內當作遞增計數器，
        // 讓一次產生多個時仍維持排序（RFC 9562 第 6.2 節方法 1）
        let lastV7Ms = 0;
        let v7Counter = 0;

        function uuidV7() {
            const bytes = crypto.getRandomValues(new Uint8Array(16));
            let ms = Date.now();
            if (ms <= lastV7Ms) {
                // 同一毫秒內（或系統時間倒退）沿用上次時間並遞增計數器；計數器用完就借用下一毫秒
                v7Counter++;
                if (v7Counter > 0xfff) {
                    lastV7Ms++;
                    v7Counter = 0;
                }
                ms = lastV7Ms;
            } else {
                lastV7Ms = ms;
                // 新的毫秒以隨機值起算，但只取 11 位元，保留空間給後續遞增
                v7Counter = ((bytes[6] & 0x07) << 8) | bytes[7];
            }
            for (let i = 5; i >= 0; i--) {
                bytes[i] = ms % 256;
                ms = Math.floor(ms / 256);
            }
            bytes[6] = v7Counter >> 8;
            bytes[7] = v7Counter & 0xff;
            return setVersion(bytes, 7);
        }

        function formatUuid(bytes, { upper, noHyphen, braces }) {
            const hex = toHex(bytes);
            let uuid = noHyphen ? hex : [hex.slice(0, 8), hex.slice(8, 12), hex.slice(12, 16), hex.slice(16, 20), hex.slice(20)].join('-');
            if (upper) uuid = uuid.toUpperCase();
            return braces ? `{${uuid}}` : uuid;
        }

        // --- 隨機字串 ---
        const CHARSETS = {
            alnum: uppercaseChars + lowercaseChars + numberChars,
            lower: lowercaseChars + numberChars,
            upper: uppercaseChars + numberChars,
            digits: numberChars,
            hex: '0123456789abcdef',
            base64url: uppercaseChars + lowercaseChars + numberChars + '-_',
        };
        const SIMILAR_CHARS = new Set('0Oo1lI');

        const uuidVersion = document.getElementById('uuidVersion');
        const uuidCount = document.getElementById('uuidCount');
        const uuidUpper = document.getElementById('uuidUpper');
        const uuidNoHyphen = document.getElementById('uuidNoHyphen');
        const uuidBraces = document.getElementById('uuidBraces');
        const stringLength = document.getElementById('stringLength');
        const stringCount = document.getElementById('stringCount');
        const stringCharset = document.getElementById('stringCharset');
        const customCharsGroup = document.getElementById('customCharsGroup');
        const customChars = document.getElementById('customChars');
        const excludeSimilar = document.getElementById('excludeSimilar');
        const stringInfo = document.getElementById('stringInfo');
        const batchOutput = document.getElementById('batchOutput');
        const batchGenerateBtn = document.getElementById('batchGenerateBtn');
        const batchCopyBtn = document.getElementById('batchCopyBtn');
        const batchResult = document.getElementById('batchResult');
        const batchError = document.getElementById('batchError');

        // 以字元（而非 UTF-16 單位）為單位去重，自訂字元可包含中文或表情符號
        function getCharPool() {
            const source = stringCharset.value === 'custom' ? customChars.value : CHARSETS[stringCharset.value];
            let chars = Array.from(new Set(Array.from(source)));
            if (excludeSimilar.checked) chars = chars.filter(c => !SIMILAR_CHARS.has(c));
            return chars;
        }

        function randomString(pool, length) {
            let result = '';
            for (let i = 0; i < length; i++) result += pool[randomInt(pool.length)];
            return result;
        }

        // --- 批次產生（隨機字串與 UUID 頁籤）---
        let activeTab = 'password-tab';

        // 讀取 1 到 max 之間的整數，不合法時回傳 null
        function readInt(input, max) {
            const n = Number(input.value);
            return Number.isInteger(n) && n >= 1 && n <= max ? n : null;
        }

        function generateBatch() {
            batchError.textContent = '';
            stringInfo.textContent = '';

            if (activeTab === 'uuid-tab') {
                const count = readInt(uuidCount, MAX_COUNT);
                if (!count) {
                    batchError.textContent = `數量需介於 1 到 ${MAX_COUNT}。`;
                    return;
                }
                const make = uuidVersion.value === '7' ? uuidV7 : uuidV4;
                const options = { upper: uuidUpper.checked, noHyphen: uuidNoHyphen.checked, braces: uuidBraces.checked };
                batchResult.value = Array.from({ length: count }, () => formatUuid(make(), options)).join('\n');
                return;
            }

            const length = readInt(stringLength, MAX_LENGTH);
            const count = readInt(stringCount, MAX_COUNT);
            if (!length || !count) {
                batchError.textContent = `長度需介於 1 到 ${MAX_LENGTH}，數量需介於 1 到 ${MAX_COUNT}。`;
                return;
            }
            const pool = getCharPool();
            if (pool.length < 2) {
                batchError.textContent = '字元集至少需要 2 種不同的字元。';
                return;
            }
            const entropy = length * Math.log2(pool.length);
            stringInfo.textContent = `字元集共 ${pool.length} 種字元，每個字串約 ${entropy.toFixed(1)} 位元熵` +
                (entropy < 64 ? '（低於 64 位元，不建議作為金鑰或權杖）' : '') + '。';
            batchResult.value = Array.from({ length: count }, () => randomString(pool, length)).join('\n');
        }

        stringCharset.addEventListener('change', () => {
            customCharsGroup.hidden = stringCharset.value !== 'custom';
        });

        [uuidVersion, uuidUpper, uuidNoHyphen, uuidBraces, stringCharset, excludeSimilar].forEach(el => el.addEventListener('change', generateBatch));
        [uuidCount, stringLength, stringCount, customChars].forEach(el => el.addEventListener('input', generateBatch));
        batchGenerateBtn.addEventListener('click', generateBatch);

        batchCopyBtn.addEventListener('click', () => {
            if (!batchResult.value) {
                alert('沒有可複製的結果！');
                return;
            }
            navigator.clipboard.writeText(batchResult.value).then(() => {
                batchCopyBtn.textContent = '已複製!';
                setTimeout(() => { batchCopyBtn.textContent = '全部複製'; }, 1500);
            }).catch(err => {
                console.error('無法複製結果: ', err);
                alert('複製失敗，請手動複製。');
            });
        });

        initTabs((tabId) => {
            activeTab = tabId;
            batchOutput.hidden = tabId === 'password-tab';
            if (tabId !== 'password-tab') generateBatch();
        });

    </script>
</body>

</html>

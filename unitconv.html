<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>單位換算 - SCITL TOOL BOX</title>
    <link rel="stylesheet" href="style.css?v=4">
        <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-9HCQRB0034"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-9HCQRB0034');
    </script>
</head>

<body>
    <div id="main-content">

        <div class="container">
            <h2>
                <center>單位換算</center>
            </h2>

            <div class="tabs-container">
                <button class="tab-btn active" data-tab="length-tab">長度換算</button>
                <button class="tab-btn" data-tab="weight-tab">重量換算</button>
                <button class="tab-btn" data-tab="area-tab">面積換算</button>
                <button class="tab-btn" data-tab="volume-tab">容量換算</button>
                <button class="tab-btn" data-tab="temperature-tab">溫度換算</button>
                <button class="tab-btn" data-tab="pressure-tab">壓力換算</button>
            </div>

            <div id="length-tab" class="tab-content active">
                <div class="converter-controls">
                    <button id="length-reset-btn" class="reset-btn">重設</button>
                </div>
                <div id="length-converter-container" class="unit-converter-grid"></div>
            </div>

            <div id="weight-tab" class="tab-content">
                <div class="converter-controls">
                    <button id="weight-reset-btn" class="reset-btn">重設</button>
                </div>
                <div id="weight-converter-container" class="unit-converter-grid"></div>
            </div>

            <div id="area-tab" class="tab-content">
                <div class="converter-controls">
                    <button id="area-reset-btn" class="reset-btn">重設</button>
                </div>
                <div id="area-converter-container" class="unit-converter-grid"></div>
            </div>

            <div id="volume-tab" class="tab-content">
                <div class="converter-controls">
                    <button id="volume-reset-btn" class="reset-btn">重設</button>
                </div>
                <div id="volume-converter-container" class="unit-converter-grid"></div>
            </div>

            <div id="temperature-tab" class="tab-content">
                <div class="converter-controls">
                    <button id="temperature-reset-btn" class="reset-btn">重設</button>
                </div>
                <div id="temperature-converter-container" class="unit-converter-grid"></div>
            </div>

            <div id="pressure-tab" class="tab-content">
                <div class="converter-controls">
                    <button id="pressure-reset-btn" class="reset-btn">重設</button>
                </div>
                <div id="pressure-converter-container" class="unit-converter-grid"></div>
            </div>

        </div>
    </div>

    <script src="main.js?v=3"></script>
    <script type="module">
        // --- 長度換算 ---
        const lengthUnits = {
            // 公制
            centimeter: { name: '公分 (cm)', toMeter: 0.01 },
            meter: { name: '公尺 (m)', toMeter: 1 },
            kilometer: { name: '公里 (km)', toMeter: 1000 },
            millimeter: { name: '公釐 (mm)', toMeter: 0.001 },
            micrometer: { name: '微米 (μm)', toMeter: 1e-6 },
            nanometer: { name: '奈米 (nm)', toMeter: 1e-9 },
            // 英制
            inch: { name: '英吋 (in)', toMeter: 0.0254 },
            foot: { name: '英呎 (ft)', toMeter: 0.3048 },
            yard: { name: '碼 (yd)', toMeter: 0.9144 },
            mile: { name: '英哩 (mi)', toMeter: 1609.344 },
            // 其他
            nauticalMile: { name: '海浬 (nmi)', toMeter: 1852 },
            taiwaneseFoot: { name: '台尺', toMeter: 10 / 33 },
            lightYear: { name: '光年 (ly)', toMeter: 9460730472580800 },
        };

        // --- 重量換算 ---
        const weightUnits = {
            // 公制
            milligram: { name: '毫克 (mg)', toKilogram: 1e-6 },
            gram: { name: '克 (g)', toKilogram: 0.001 },
            kilogram: { name: '公斤 (kg)', toKilogram: 1 },
            metricTon: { name: '公噸 (t)', toKilogram: 1000 },
            // 英制
            ounce: { name: '盎司 (oz)', toKilogram: 0.028349523125 },
            pound: { name: '磅 (lb)', toKilogram: 0.45359237 },
            // 其他
            taiwaneseJin: { name: '台斤', toKilogram: 0.6 },
            taiwaneseTael: { name: '台兩', toKilogram: 0.0375 },
            carat: { name: '克拉 (ct)', toKilogram: 0.0002 },
            goldMace: { name: '黃金(錢)', toKilogram: 0.00375 },
            goldTael: { name: '黃金(兩)', toKilogram: 0.0375 },
            goldOunce: { name: '黃金(盎司)', toKilogram: 0.0311034768 },
        };

        // --- 面積換算 ---
        const areaUnits = {
            // 公制
            squareMillimeter: { name: '平方公釐 (mm²)', toSquareMeter: 1e-6 },
            squareCentimeter: { name: '平方公分 (cm²)', toSquareMeter: 0.0001 },
            squareMeter: { name: '平方公尺 (m²)', toSquareMeter: 1 },
            are: { name: '公畝 (a)', toSquareMeter: 100 },
            hectare: { name: '公頃 (ha)', toSquareMeter: 10000 },
            squareKilometer: { name: '平方公里 (km²)', toSquareMeter: 1e6 },
            // 英制
            squareInch: { name: '平方英吋 (in²)', toSquareMeter: 0.00064516 },
            squareFoot: { name: '平方英呎 (ft²)', toSquareMeter: 0.09290304 },
            squareYard: { name: '平方碼 (yd²)', toSquareMeter: 0.83612736 },
            acre: { name: '英畝 (ac)', toSquareMeter: 4046.8564224 },
            squareMile: { name: '平方英哩 (mi²)', toSquareMeter: 2589988.110336 },
            // 其他
            taiwaneseJia: { name: '甲', toSquareMeter: 9699 },
            taiwaneseFen: { name: '分', toSquareMeter: 969.9 },
            ping: { name: '坪', toSquareMeter: 3.305785 },
            tatami: { name: '疊 (榻榻米)', toSquareMeter: 1.6562 },
        };

        // --- 容量換算 ---
        const volumeUnits = {
            // 公制
            milliliter: { name: '毫升 (ml)', toLiter: 0.001 },
            liter: { name: '公升 (L)', toLiter: 1 },
            cubicMeter: { name: '立方公尺 (m³)', toLiter: 1000 },
            // 英制/美制
            usFluidOunce: { name: '美制液盎司 (fl oz)', toLiter: 0.0295735295625 },
            impFluidOunce: { name: '英制液盎司 (fl oz)', toLiter: 0.0284130625 },
            usPint: { name: '美制品脫 (pt)', toLiter: 0.473176473 },
            usQuart: { name: '美制夸脫 (qt)', toLiter: 0.946352946 },
            usGallon: { name: '美制加侖 (gal)', toLiter: 3.785411784 },
            impGallon: { name: '英制加侖 (gal)', toLiter: 4.54609 },
        };

        // --- 溫度換算 ---
        const temperatureUnits = {
            celsius: { name: '攝氏度 (°C)', isLinear: false },
            fahrenheit: { name: '華氏度 (°F)', isLinear: false },
            kelvin: { name: '克耳文 (K)', isLinear: false },
        };

        // --- 壓力換算 ---
        const pressureUnits = {
            // 公制 / SI
            pa: { name: '帕 (Pa)', toKpa: 0.001 },
            hpa: { name: '百帕 (hPa)', toKpa: 0.1 },
            kpa: { name: '千帕 (kPa)', toKpa: 1 },
            mpa: { name: '兆帕 (MPa)', toKpa: 1000 },
            bar: { name: '巴 (bar)', toKpa: 100 },
            mbar: { name: '毫巴 (mbar)', toKpa: 0.1 },
            kgfcm2: { name: '公斤力/平方公分 (kgf/cm²)', toKpa: 98.0665 },
            // 英制
            psi: { name: '磅/平方吋 (psi)', toKpa: 6.894757 },
            inHg: { name: '英吋汞柱 (inHg)', toKpa: 3.386389 },
            inH2O: { name: '英吋水柱 (inH₂O)', toKpa: 0.249089 },
            // 其他
            atm: { name: '標準大氣壓 (atm)', toKpa: 101.325 },
            mmHg: { name: '毫米汞柱 (mmHg)', toKpa: 0.133322 },
            torr: { name: '托 (Torr)', toKpa: 101.325 / 760 },
            mmH2O: { name: '毫米水柱 (mmH₂O)', toKpa: 0.00980665 },
        };

        // 各單位以 factor（換算成基準單位的倍率）統一處理；溫度為非線性，另行處理
        const linearCategories = {
            length: { units: lengthUnits, base: 'toMeter' },
            weight: { units: weightUnits, base: 'toKilogram' },
            area: { units: areaUnits, base: 'toSquareMeter' },
            volume: { units: volumeUnits, base: 'toLiter' },
            pressure: { units: pressureUnits, base: 'toKpa' },
        };

        for (const [type, { units, base }] of Object.entries(linearCategories)) {
            initializeConverter(type, units, (event) => convertLinear(event, units, type, base));
        }
        initializeConverter('temperature', temperatureUnits, (event) => convertTemperature(event, temperatureUnits, 'temperature'));

        function initializeConverter(type, units, conversionHandler) {
            const container = document.getElementById(`${type}-converter-container`);

            // 動態生成輸入框
            for (const unit in units) {
                const group = document.createElement('div');
                group.className = 'unit-input-group';

                const label = document.createElement('label');
                label.htmlFor = `${type}-input-${unit}`;
                label.textContent = units[unit].name;

                const input = document.createElement('input');
                input.type = 'number';
                input.id = `${type}-input-${unit}`;
                input.dataset.unit = unit;
                input.className = 'form-input';
                input.addEventListener('input', conversionHandler);

                group.appendChild(label);
                group.appendChild(input);
                container.appendChild(group);
            }

            // 重設按鈕
            document.getElementById(`${type}-reset-btn`).addEventListener('click', () => {
                container.querySelectorAll('input').forEach(input => input.value = '');
            });
        }

        // 取得來源輸入框的數值，空白或無效時回傳 null 並清空所有欄位
        function readSource(event, units, type) {
            const sourceInput = event.target;
            const value = parseFloat(sourceInput.value);
            if (isNaN(value)) {
                for (const unit in units) {
                    document.getElementById(`${type}-input-${unit}`).value = '';
                }
                return null;
            }
            return { unit: sourceInput.dataset.unit, value };
        }

        function setOthers(units, type, sourceUnit, convert) {
            for (const unit in units) {
                if (unit === sourceUnit) continue;
                document.getElementById(`${type}-input-${unit}`).value = parseFloat(convert(unit).toPrecision(10));
            }
        }

        function convertLinear(event, units, type, base) {
            const source = readSource(event, units, type);
            if (!source) return;
            const valueInBase = source.value * units[source.unit][base];
            setOthers(units, type, source.unit, unit => valueInBase / units[unit][base]);
        }

        function convertTemperature(event, units, type) {
            const source = readSource(event, units, type);
            if (!source) return;
            const toCelsius = { celsius: v => v, fahrenheit: v => (v - 32) * 5 / 9, kelvin: v => v - 273.15 };
            const fromCelsius = { celsius: c => c, fahrenheit: c => c * 9 / 5 + 32, kelvin: c => c + 273.15 };
            const celsius = toCelsius[source.unit](source.value);
            setOthers(units, type, source.unit, unit => fromCelsius[unit](celsius));
        }

        initTabs();
    </script>
</body>

</html>
